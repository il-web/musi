// musi's AirPlay receiver (shairport-sync, run as the musi user service
// musi-airplay.service). update.sh installs this to ~/.config/musi/ with
// @HOME@ replaced by the real home directory.

general = {
  name = "musi";
  output_backend = "alsa";
  // "basic" interpolation: soxr sounds marginally better but costs a lot of
  // CPU on a Pi 3, which also has to draw the UI.
  interpolation = "basic";
  ignore_volume_control = "no";      // the phone's volume slider works
  volume_range_db = 60;
  // Remote control (play/pause/next from musi's buttons) over the user's
  // session bus — the same bus musi's MPRIS bits already use.
  dbus_service_bus = "session";
  mpris_service_bus = "session";
};

sessioncontrol = {
  // MPD and AirPlay share one audio output: stop MPD before the phone's
  // audio starts, tell musi when it ends. wait_for_completion so MPD has
  // really let go of the device before shairport-sync opens it.
  run_this_before_play_begins = "@HOME@/.local/bin/musi-airplay begin";
  run_this_after_play_ends = "@HOME@/.local/bin/musi-airplay end";
  wait_for_completion = "yes";
  allow_session_interruption = "yes";  // another phone can take over
  session_timeout = 20;
};

alsa = {
  // the router-managed PCM in ~/.asoundrc: DAC or the Bluetooth device
  output_device = "musiout";
};

metadata = {
  // title / artist / album / cover for musi's Now Playing
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};
