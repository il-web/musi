# musi remote API tunnel — cloudflared named-tunnel config.
#
# Copy to /etc/cloudflared/config.yml and replace <TUNNEL_ID>, <USER> and
# <DOMAIN>. Full walkthrough: docs/tunnel-setup.md
#
# The binary is pinned by update.sh (generic ARM build — armhf crashes on
# the Zero W's ARMv6), so the service must not self-update.

tunnel: <TUNNEL_ID>
credentials-file: /home/<USER>/.cloudflared/<TUNNEL_ID>.json

no-autoupdate: true

# QUIC (default) works, but http2 is lighter on flaky WiFi — uncomment if
# the tunnel drops often:
# protocol: http2

ingress:
  # ONLY the authenticated JSON API is exposed to the internet. The legacy
  # tokenless upload page (/, /upload, /stats) stays LAN-only: it doesn't
  # match here (-> 404), and the app itself 404s any request carrying
  # Cloudflare headers as a second line of defence.
  - hostname: api.<DOMAIN>
    path: ^/api/.*
    service: http://localhost:8080
  - service: http_status:404
