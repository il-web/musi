# MPD configuration for musi player — Raspberry Pi with PCM5102A I2S DAC
# Place at: /etc/mpd.conf  (or ~/.config/mpd/mpd.conf for user-mode MPD)

music_directory     "/home/pi/Music"
playlist_directory  "/home/pi/.mpd/playlists"
db_file             "/home/pi/.local/share/musi/mpd.db"
log_file            "/home/pi/.local/share/musi/mpd.log"
state_file          "/home/pi/.local/share/musi/mpd.state"
sticker_database    "/home/pi/.local/share/musi/mpd.sticker.db"

bind_to_address     "127.0.0.1"
port                "6600"

user                "pi"
group               "audio"

auto_update         "yes"
auto_update_depth   "3"

# Volume normalization (optional — helps with varied album levels)
replaygain          "auto"

# PCM5102A I2S DAC — appears as hw:0,0 after enabling hifiberry-dac overlay
# If the card doesn't show up, run: aplay -l  to find the correct card/device
audio_output {
    type        "alsa"
    name        "PCM5102A DAC"
    device      "hw:0,0"
    mixer_type  "software"
    # mixer_type "none"  # use this instead if software volume sounds bad
}

# Uncomment to also output via PulseAudio (useful for Bluetooth audio)
#audio_output {
#    type    "pulse"
#    name    "PulseAudio"
#}
